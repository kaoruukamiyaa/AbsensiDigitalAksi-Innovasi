async function postToSheet(payload) {

        method: 'POST',

async function syncAttendanceToSheet(participant, meeting) {
    if (!isWebhookReady()) { console.warn('GOOGLE_SHEET_WEBHOOK_URL belum diisi.'); return; }
    try {
        await postToSheet({
            kegiatan: meeting.title,
            tanggal: meeting.date,
            lokasi: meeting.location,
            nama: participant.name,
            gender: participant.gender,
            institusi: participant.institution,
            jabatan: participant.role,
            telepon: participant.phone,
            disabilitas: participant.notDisabled
                ? 'Bukan Disabilitas'
                : (participant.declineDisabilityInfo
                    ? 'Tidak bersedia menyebutkan'
                    : [...(participant.disabilities || []), participant.disabilityOther].filter(Boolean).join(', ')),
            waktuAbsen: new Date().toISOString(),
        });
    } catch (err) { console.error('Gagal mengirim data ke Google Sheets:', err); }
}
async function syncSettingsToSheet(meeting) {
    if (!isWebhookReady()) { console.warn('GOOGLE_SHEET_WEBHOOK_URL belum diisi.'); return false; }
    try {
        await postToSheet({
            action: 'saveSettings',
            date: meeting.date,
            title: meeting.title,
            time: meeting.time,
            endTime: meeting.endTime,
            mode: meeting.mode,
            location: meeting.location,
            allowManualEntry: meeting.allowManualEntry,
        });
        return true;
    } catch (err) { console.error('Gagal menyimpan pengaturan ke Google Sheets:', err); return false; }
}
async function syncParticipantToSheet(meeting, participant, opts = {}) {
    if (!isWebhookReady()) { console.warn('GOOGLE_SHEET_WEBHOOK_URL belum diisi.'); return false; }
    try {
        await postToSheet({
            action: 'saveParticipant',
            id: participant.id,
            tanggal: meeting.date,
            kegiatan: meeting.title,
            lokasi: meeting.location,
            nama: participant.name,
            gender: participant.gender,
            institusi: participant.institution,
            jabatan: participant.role,
            telepon: participant.phone,
            notDisabled: participant.notDisabled,
            disabilitas: (participant.disabilities || []).join(', '),
            disabilitasLainnya: participant.disabilityOther || '',

            signature: (!opts.clearSignature && participant.signature && participant.signature.startsWith('data:')) ? participant.signature : '',

            waktuAbsen: participant.signature ? new Date().toISOString() : '',

}

async function fetchAllDataFromSheet(date) {
    if (!isWebhookReady()) return null;
    try {
        const url = `${GOOGLE_SHEET_WEBHOOK_URL}?action=getData&date=${encodeURIComponent(date)}`;
        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        if (!data || data.error) return null;
        return { settings: data.settings || null, participants: Array.isArray(data.participants) ? data.participants : [] };
    } catch (err) {
        console.error('Gagal mengambil data dari Google Sheets:', err);
        return null;
    }
}
async function fetchEventsList() {
    if (!isWebhookReady()) return [];
    try {
        const url = `${GOOGLE_SHEET_WEBHOOK_URL}?action=listEvents`;
        const res = await fetch(url);
        if (!res.ok) return [];
        const data = await res.json();
        const list = Array.isArray(data && data.events) ? data.events : [];
        return list.map(ev => ({ ...ev, date: normalizeDateValue(ev.date) }));
    } catch (err) {
        console.error('Gagal mengambil daftar kegiatan:', err);
        return [];
    }
}

const STORAGE_KEY = 'aksiAbsensiDataByDate';
function loadAllSavedData() {
    try {

    } catch (err) { console.error('Gagal membaca data tersimpan:', err); return {}; }
}
function loadSavedDataForDate(date) {

}
function saveDataForDate(date, data) {
    try {
        const all = loadAllSavedData();
        all[date] = data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
        return true;
    } catch (err) { console.error('Gagal menyimpan data:', err); return false; }

// TANGGAL & JAM
// ==========================================
// Tanggal hari ini menurut zona waktu WIB (bukan UTC), format YYYY-MM-DD.
// (toISOString() memakai UTC sehingga jam 00.00-06.59 WIB tanggalnya masih kemarin.)
function getTodayWIB() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' });
}
// Jam sekarang diperlakukan sebagai TEKS biasa (mis. "09.00" atau "09:00 - 12:00").
// Tidak ada konversi zona waktu lagi. Satu-satunya pengecualian: data lama dari
// spreadsheet yang berbentuk ISO "1899-12-30T..." dikonversi sekali ke "HH:MM" WIB.
function normalizeTimeValue(value) {
    if (value === null || value === undefined) return '';
    if (typeof value !== 'string') return String(value);
    if (/^1899-12-3\d?T/.test(value) || /^\d{4}-\d{2}-\d{2}T/.test(value)) {
        const d = new Date(value);
        if (!isNaN(d.getTime())) {
            let total = d.getUTCHours() * 60 + d.getUTCMinutes() + 7 * 60;
            total = ((total % 1440) + 1440) % 1440;
            return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
        }
        return '';
    }
    return value; // teks biasa: biarkan apa adanya
}
// Tanggal dari spreadsheet: kalau berupa ISO datetime (UTC), ubah ke tanggal WIB.
function normalizeDateValue(value) {
    if (!value) return '';
    if (typeof value !== 'string') return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
    if (value.includes('T')) {
        const d = new Date(value);
        if (!isNaN(d.getTime())) {
            return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' });
        }
        return value.split('T')[0];
    }
    return value;
}
// Format tanggal panjang bahasa Indonesia. timeZone UTC dipakai karena string
// "YYYY-MM-DD" diparse sebagai tengah malam UTC — supaya tidak bergeser hari.
function formatDateID(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00Z');
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
}
function waitForPrintImages(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return Promise.resolve();
    const imgs = Array.from(container.querySelectorAll('img'));
    return Promise.all(imgs.map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise(resolve => {
            const done = () => resolve();
            img.addEventListener('load', done, { once: true });
            img.addEventListener('error', done, { once: true });
            setTimeout(done, 8000);
        });
    }));
}
