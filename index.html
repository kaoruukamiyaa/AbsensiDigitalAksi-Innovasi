// Pakai mode 'no-cors' karena Apps Script Web App tidak mengizinkan pembacaan response
// dari domain lain, tapi permintaannya tetap sampai & tercatat di spreadsheet.
async function syncAttendanceToSheet(participant, meeting) {
    if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes('PASTE_URL')) {
        console.warn('GOOGLE_SHEET_WEBHOOK_URL belum diisi — data tidak dikirim ke spreadsheet.');
        return;
    }
    try {
        await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' }, // hindari CORS preflight yang sering diblokir Apps Script
            body: JSON.stringify({
                kegiatan: meeting.title,
                tanggal: meeting.date,
                lokasi: meeting.location,
                nama: participant.name,
                gender: participant.gender,
                institusi: participant.institution,
                jabatan: participant.role,
                telepon: participant.phone,
                disabilitas: participant.notDisabled
                    ? 'Bukan Disabilitas'
                    : (participant.declineDisabilityInfo
                        ? 'Tidak bersedia menyebutkan'
                        : [...(participant.disabilities || []), participant.disabilityOther].filter(Boolean).join(', ')),
                waktuAbsen: new Date().toISOString(),
            }),
        });
    }
    catch (err) {
        console.error('Gagal mengirim data ke Google Sheets:', err);
    }
}
// Kirim pengaturan kegiatan (judul, jam, mode, lokasi, dll) ke tab "Pengaturan" di
// spreadsheet yang sama, dikelompokkan per tanggal — supaya semua perangkat yang

// di tiap perangkat. Butuh Apps Script versi terbaru (lihat panduan terpisah).
async function syncSettingsToSheet(meeting) {
    if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes('PASTE_URL')) {
        console.warn('GOOGLE_SHEET_WEBHOOK_URL belum diisi — pengaturan tidak dikirim ke spreadsheet.');
        return false;
    }
    try {
        await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
                action: 'saveSettings',
                date: meeting.date,
                title: meeting.title,
                time: meeting.time,
                endTime: meeting.endTime,
                mode: meeting.mode,
                location: meeting.location,
                allowManualEntry: meeting.allowManualEntry,
            }),
        });
        return true; // no-cors: kita tidak bisa baca respons, tapi permintaan sudah terkirim
    }
    catch (err) {
        console.error('Gagal menyimpan pengaturan ke Google Sheets:', err);
        return false;
    }
}

// di-upload ke Google Drive oleh Apps Script, spreadsheet hanya menyimpan link-nya.
async function syncParticipantToSheet(meeting, participant, opts = {}) {
    if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes('PASTE_URL')) {
        console.warn('GOOGLE_SHEET_WEBHOOK_URL belum diisi — data peserta tidak dikirim ke spreadsheet.');
        return false;
    }
    try {
        await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
                action: 'saveParticipant',
                id: participant.id,
                tanggal: meeting.date,
                kegiatan: meeting.title,
                lokasi: meeting.location,
                nama: participant.name,
                gender: participant.gender,
                institusi: participant.institution,
                jabatan: participant.role,
                telepon: participant.phone,
                notDisabled: participant.notDisabled,
                disabilitas: (participant.disabilities || []).join(', '),
                disabilitasLainnya: participant.disabilityOther || '',
                tolakSebutkan: participant.declineDisabilityInfo,
                // Kirim base64 TTD hanya kalau baru digambar (bukan URL Drive yang sudah tersimpan sebelumnya)
                signature: (!opts.clearSignature && participant.signature && participant.signature.startsWith('data:')) ? participant.signature : '',
                clearSignature: !!opts.clearSignature,
                waktuAbsen: participant.signature ? new Date().toISOString() : '',
            }),
        });
        return true;
    }
    catch (err) {
        console.error('Gagal menyimpan data peserta ke Google Sheets:', err);
        return false;
    }
}

// Ambil pengaturan kegiatan + seluruh daftar peserta untuk tanggal tertentu dari
// spreadsheet sekaligus (satu request), dipakai saat halaman pertama dibuka supaya
// semua perangkat menampilkan data yang sama persis.
async function fetchAllDataFromSheet(date) {
    if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes('PASTE_URL'))
        return null;
    try {
        const url = `${GOOGLE_SHEET_WEBHOOK_URL}?action=getData&date=${encodeURIComponent(date)}`;
        const res = await fetch(url);
        if (!res.ok)
            return null;
        const data = await res.json();
        if (!data || data.error)
            return null;
        return { settings: data.settings || null, participants: Array.isArray(data.participants) ? data.participants : [] };
    }
    catch (err) {
        console.error('Gagal mengambil data dari Google Sheets (mungkin Apps Script belum di-update):', err);
        return null;
    }
}

// Setiap kegiatan/tanggal punya data sendiri (judul, lokasi, header PDF, peserta),
// disimpan di localStorage browser supaya tidak hilang saat halaman di-refresh

const STORAGE_KEY = 'aksiAbsensiDataByDate';
function loadAllSavedData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
    }
    catch (err) {
        console.error('Gagal membaca data tersimpan:', err);
        return {};
    }
}
function loadSavedDataForDate(date) {
    const all = loadAllSavedData();
    return all[date] || null;
}
function saveDataForDate(date, data) {
    try {
        const all = loadAllSavedData();
        all[date] = data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
        return true;
    }
    catch (err) {
        console.error('Gagal menyimpan data:', err);
        return false;
    }
}
// Google Sheets menyimpan nilai sel bertipe "Time" secara internal sebagai tanggal
// dasar 30 Desember 1899 + jam yang dimasukkan. Kalau Apps Script mengirim baliknya
// sebagai Date, JSON akan berupa string seperti "1899-12-30T12:17:56.000Z" — fungsi
// ini menormalkannya kembali jadi "HH:MM" biasa. Kalau nilainya sudah "HH:MM", dibiarkan.
function normalizeTimeValue(value) {
    if (!value)
        return '';
    if (typeof value !== 'string')
        return '';
    if (/^\d{1,2}:\d{2}/.test(value))
        return value.slice(0, 5);
    if (value.includes('T')) {
        const d = new Date(value);
        if (!isNaN(d.getTime())) {
            // Apps Script menyimpan & membaca jam sesuai zona waktu proyeknya (WIB/UTC+7),
            // tapi saat dikirim sebagai JSON otomatis dikonversi ke UTC (dikurangi 7 jam).
            // Tambahkan lagi 7 jam di sini supaya kembali ke jam WIB yang sebenarnya dimasukkan.
            const WIB_OFFSET_MINUTES = 7 * 60;
            let totalMinutes = d.getUTCHours() * 60 + d.getUTCMinutes() + WIB_OFFSET_MINUTES;
            totalMinutes = ((totalMinutes % 1440) + 1440) % 1440; // bungkus 0-23:59
            const hh = String(Math.floor(totalMinutes / 60)).padStart(2, '0');
            const mm = String(totalMinutes % 60).padStart(2, '0');
            return `${hh}:${mm}`;
        }
    }
    return '';
}
// Sama seperti di atas tapi untuk sel bertipe "Date" — kalau baliknya berupa
// datetime ISO penuh, ambil bagian tanggalnya saja (YYYY-MM-DD).
function normalizeDateValue(value) {
    if (!value)
        return '';
    if (typeof value !== 'string')
        return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(value))
        return value;
    if (value.includes('T'))
        return value.split('T')[0];
    return value;
}
// Tanda tangan yang datang dari Google Drive (setelah refresh/sinkron dari perangkat lain)
// dimuat lewat internet, bukan lagi base64 langsung — butuh waktu untuk sampai. Kalau
// window.print() langsung dipanggil, kotak TTD bisa kosong di hasil cetak/PDF karena
// gambarnya belum sempat termuat. Fungsi ini menunggu SEMUA gambar TTD selesai (atau gagal,
// atau timeout 8 detik per gambar — supaya tidak macet selamanya kalau 1 link rusak)
// sebelum dialog cetak dibuka.
function waitForPrintImages(containerId) {
    const container = document.getElementById(containerId);
    if (!container)
        return Promise.resolve();
    const imgs = Array.from(container.querySelectorAll('img'));
    return Promise.all(imgs.map(img => {
        if (img.complete && img.naturalWidth > 0)
            return Promise.resolve();
        return new Promise(resolve => {
            const done = () => resolve();
            img.addEventListener('load', done, { once: true });
            img.addEventListener('error', done, { once: true }); // jangan macet kalau 1 link gagal
            setTimeout(done, 8000);
        });
    }));
}

    const [pdfHeader, setPdfHeader] = useState(() => {
        const saved = loadSavedDataForDate(todayStr);
        if (saved && saved.pdfHeader)
            return saved.pdfHeader;
        return {
            text: 'DAFTAR HADIR',
            logo: LOGO_AKSI // Logo AKSI tertanam langsung di kode (data URL), jadi otomatis tampil tanpa perlu upload manual.
        };
    });

    useEffect(() => {
        let isMounted = true;
        (async () => {
            const remote = await fetchAllDataFromSheet(todayStr);
            if (isMounted && remote) {
                if (remote.settings) {
                    const s = remote.settings;
                    setMeeting(prev => ({
                        ...prev,
                        ...s,
                        time: normalizeTimeValue(s.time),
                        endTime: normalizeTimeValue(s.endTime),
                        date: normalizeDateValue(s.date) || prev.date,
                    }));
                }

            }

    }, []);

        if (isAdminAuth) {
            setView('admin');
        }
        else {

            setModal({ isOpen: true, type: 'login', message: 'Masukkan Password Admin untuk melanjutkan' });
        }
    };

            e.preventDefault();

            setModal({ isOpen: false, type: '', message: '', onConfirm: null });

        setActiveParticipant(newUser);

            isOpen: true,
            type: 'confirm',
            message: `Hapus data "${p.name}" dari daftar hadir?`,
            onConfirm: () => {
                setParticipants(prev => prev.filter(x => x.id !== p.id));
                deleteParticipantFromSheet(meeting, p.id);
            }
        });
    };
    const handleSaveSignature = (signatureDataUrl) => {
        const signedParticipant = { ...activeParticipant, signature: signatureDataUrl };
        setParticipants(prev => prev.map(p => p.id === activeParticipant.id ? signedParticipant : p));
