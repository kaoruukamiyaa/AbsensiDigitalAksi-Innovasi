// Kirim data kehadiran ke Google Sheets lewat Apps Script Web App.
// Pakai mode 'no-cors' karena Apps Script Web App tidak mengizinkan pembacaan response
// dari domain lain, tapi permintaannya tetap sampai & tercatat di spreadsheet.
async function syncAttendanceToSheet(participant, meeting) {
  if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes('PASTE_URL')) {
    console.warn('GOOGLE_SHEET_WEBHOOK_URL belum diisi — data tidak dikirim ke spreadsheet.');
    return;
  }
  try {
    await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' }, // hindari CORS preflight yang sering diblokir Apps Script
      body: JSON.stringify({
        kegiatan: meeting.title,
        tanggal: meeting.date,
        lokasi: meeting.location,
        nama: participant.name,
        gender: participant.gender,
        institusi: participant.institution,
        jabatan: participant.role,
        telepon: participant.phone,
        disabilitas: participant.notDisabled
          ? 'Bukan Disabilitas'
          : (participant.declineDisabilityInfo
              ? 'Tidak bersedia menyebutkan'
              : [...(participant.disabilities || []), participant.disabilityOther].filter(Boolean).join(', ')),
        waktuAbsen: new Date().toISOString(),
      }),
    });
  } catch (err) {
    console.error('Gagal mengirim data ke Google Sheets:', err);
  }
}

// Kirim pengaturan kegiatan (judul, jam, mode, lokasi, dll) ke tab "Pengaturan" di
// spreadsheet yang sama, dikelompokkan per tanggal — supaya semua perangkat yang
// membuka halaman ini otomatis melihat data yang sama, tanpa perlu simpan manual
// di tiap perangkat. Butuh Apps Script versi terbaru (lihat panduan terpisah).
async function syncSettingsToSheet(meeting) {
  if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes('PASTE_URL')) {
    console.warn('GOOGLE_SHEET_WEBHOOK_URL belum diisi — pengaturan tidak dikirim ke spreadsheet.');
    return false;
  }
  try {
    await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'saveSettings',
        date: meeting.date,
        title: meeting.title,
        time: meeting.time,
        mode: meeting.mode,
        location: meeting.location,
        allowManualEntry: meeting.allowManualEntry,
      }),
    });
    return true; // no-cors: kita tidak bisa baca respons, tapi permintaan sudah terkirim
  } catch (err) {
    console.error('Gagal menyimpan pengaturan ke Google Sheets:', err);
    return false;
  }
}

// Kirim data satu peserta (identitas, disabilitas, tanda tangan) ke tab "Peserta" di
// spreadsheet — di-upsert berdasarkan ID, jadi dipakai baik saat admin menambah peserta
// (belum TTD) maupun saat peserta menandatangani (dengan TTD). Tanda tangan otomatis
// di-upload ke Google Drive oleh Apps Script, spreadsheet hanya menyimpan link-nya.
async function syncParticipantToSheet(meeting, participant, opts = {}) {
  if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes('PASTE_URL')) {
    console.warn('GOOGLE_SHEET_WEBHOOK_URL belum diisi — data peserta tidak dikirim ke spreadsheet.');
    return false;
  }
  try {
    await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'saveParticipant',
        id: participant.id,
        tanggal: meeting.date,
        kegiatan: meeting.title,
        lokasi: meeting.location,
        nama: participant.name,
        gender: participant.gender,
        institusi: participant.institution,
        jabatan: participant.role,
        telepon: participant.phone,
        notDisabled: participant.notDisabled,
        disabilitas: (participant.disabilities || []).join(', '),
        disabilitasLainnya: participant.disabilityOther || '',
        tolakSebutkan: participant.declineDisabilityInfo,
        // Kirim base64 TTD hanya kalau baru digambar (bukan URL Drive yang sudah tersimpan sebelumnya)
        signature: (!opts.clearSignature && participant.signature && participant.signature.startsWith('data:')) ? participant.signature : '',
        clearSignature: !!opts.clearSignature,
        waktuAbsen: participant.signature ? new Date().toISOString() : '',
      }),
    });
    return true;
  } catch (err) {
    console.error('Gagal menyimpan data peserta ke Google Sheets:', err);
    return false;
  }
}

// Hapus satu baris peserta dari tab "Peserta" di spreadsheet.
async function deleteParticipantFromSheet(meeting, participantId) {
  if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes('PASTE_URL')) return false;
  try {
    await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'deleteParticipant', id: participantId, tanggal: meeting.date }),
    });
    return true;
  } catch (err) {
    console.error('Gagal menghapus data peserta di Google Sheets:', err);
    return false;
  }
}

// Ambil pengaturan kegiatan + seluruh daftar peserta untuk tanggal tertentu dari
// spreadsheet sekaligus (satu request), dipakai saat halaman pertama dibuka supaya
// semua perangkat menampilkan data yang sama persis.
async function fetchAllDataFromSheet(date) {
  if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes('PASTE_URL')) return null;
  try {
    const url = `${GOOGLE_SHEET_WEBHOOK_URL}?action=getData&date=${encodeURIComponent(date)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    if (!data || data.error) return null;
    return { settings: data.settings || null, participants: Array.isArray(data.participants) ? data.participants : [] };
  } catch (err) {
    console.error('Gagal mengambil data dari Google Sheets (mungkin Apps Script belum di-update):', err);
    return null;
  }
}

// ==========================================
// PENYIMPANAN DATA LOKAL (per tanggal kegiatan)
// Setiap kegiatan/tanggal punya data sendiri (judul, lokasi, header PDF, peserta),
// disimpan di localStorage browser supaya tidak hilang saat halaman di-refresh
// dan supaya data dummy tidak muncul lagi setelah admin menyimpan data asli.
// ==========================================
const STORAGE_KEY = 'aksiAbsensiDataByDate';

function loadAllSavedData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (err) {
    console.error('Gagal membaca data tersimpan:', err);
    return {};
  }
}

function loadSavedDataForDate(date) {
  const all = loadAllSavedData();
  return all[date] || null;
}

function saveDataForDate(date, data) {
  try {
    const all = loadAllSavedData();
    all[date] = data;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    return true;
  } catch (err) {
    console.error('Gagal menyimpan data:', err);
    return false;
  }
}

  const [pdfHeader, setPdfHeader] = useState(() => {
    const saved = loadSavedDataForDate(todayStr);
    if (saved && saved.pdfHeader) return saved.pdfHeader;
    return {
      text: 'DAFTAR HADIR',
      logo: LOGO_AKSI // Logo AKSI tertanam langsung di kode (data URL), jadi otomatis tampil tanpa perlu upload manual.
    };
  });

  // Participants Data State — dimuat dari data tersimpan untuk tanggal ini kalau ada.
  // Kalau belum pernah disimpan, mulai dari daftar kosong (data dummy dihapus).
  const [participants, setParticipants] = useState(() => {
    const saved = loadSavedDataForDate(todayStr);
    if (saved && Array.isArray(saved.participants)) return saved.participants;
    return [];
  });

  const [activeParticipant, setActiveParticipant] = useState(null);

  // Inject CSS Print Khusus
  useEffect(() => {
    const style = document.createElement('style');
    style.innerHTML = `
      @media print {
        @page { size: landscape; margin: 10mm 15mm; }
        body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        ::-webkit-scrollbar { display: none; }
      }
      /* Cegah Safari iOS otomatis zoom saat input difokus (butuh font >= 16px) */
      input, textarea, select { font-size: 16px !important; }
    `;
    document.head.appendChild(style);
    return () => document.head.removeChild(style);
  }, []);

  // Saat halaman pertama kali dibuka, coba ambil pengaturan + daftar peserta untuk
  // tanggal ini dari spreadsheet. Kalau berhasil, pakai itu (supaya semua perangkat
  // seragam, real-time) — kalau gagal (mis. Apps Script belum di-update, atau offline),
  // tetap pakai data lokal (localStorage) yang sudah dimuat sebelumnya.
  useEffect(() => {
    let isMounted = true;
    (async () => {
      const remote = await fetchAllDataFromSheet(todayStr);
      if (isMounted && remote) {
        if (remote.settings) setMeeting(prev => ({ ...prev, ...remote.settings }));
        setParticipants(remote.participants);
      }
    })();
    return () => { isMounted = false; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // --- HANDLERS ---
  const handleAdminLogin = () => {
    if (isAdminAuth) {
      setView('admin');
    } else {
      setPasswordInput('');
      setModal({ isOpen: true, type: 'login', message: 'Masukkan Password Admin untuk melanjutkan' });
    }
  };

  const submitLogin = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (passwordInput === 'admin123') {
      setIsAdminAuth(true);
      setModal({ isOpen: false, type: '', message: '', onConfirm: null });
      setView('admin');
    } else {
      setModal({ isOpen: true, type: 'alert', message: 'Password salah!' });
    }
  };

  const handleSignClick = (participant) => {
    setActiveParticipant(participant);
    setView('sign');
  };

  const handleSelfRegisterSubmit = (newUserData) => {
    const newUser = { ...newUserData, id: Date.now(), signature: null };
    setParticipants(prev => [...prev, newUser]);
    setActiveParticipant(newUser);
    setView('sign');
  };

  const handleSaveSignature = (signatureDataUrl) => {
    const signedParticipant = { ...activeParticipant, signature: signatureDataUrl };
    setParticipants(prev => 
      prev.map(p => p.id === activeParticipant.id ? signedParticipant : p)
    );
    syncAttendanceToSheet(signedParticipant, meeting); // Catat ke tab riwayat "Kehadiran" (audit trail)
    syncParticipantToSheet(meeting, signedParticipant); // Update tab "Peserta" + upload TTD ke Google Drive
    setView('thankyou');
    setTimeout(() => {
      setView('list');
      setActiveParticipant(null);
    }, 2500);
  };

  // Simpan pengaturan kegiatan (judul, tanggal, jam, mode, lokasi, header PDF) + peserta
  // saat ini ke localStorage (cache di perangkat ini) DAN ke spreadsheet (supaya semua
  // perangkat lain otomatis ikut melihat data yang sama). Dipanggil lewat tombol
  // "Simpan Data" di Portal Admin.
  const handleSaveMeetingSettings = async () => {
    const localSuccess = saveDataForDate(meeting.date, { meeting, pdfHeader, participants });
    const remoteSuccess = await syncSettingsToSheet(meeting);
    setModal({
      isOpen: true,
      type: 'alert',
      message: !localSuccess
        ? 'Gagal menyimpan data di perangkat ini. Coba lagi.'
        : remoteSuccess
          ? `Data kegiatan untuk tanggal ${meeting.date} berhasil disimpan dan dikirim ke spreadsheet — akan otomatis muncul di semua perangkat yang membuka halaman ini pada tanggal yang sama.`
          : `Data tersimpan di perangkat ini, tapi gagal terkirim ke spreadsheet. Pastikan koneksi internet aktif dan Apps Script sudah menggunakan versi terbaru.`
    });
  };

  // Auto-simpan data peserta (mis. saat ada yang tanda tangan / isi mandiri / admin
  // tambah-hapus peserta) supaya data kehadiran tidak hilang saat halaman di-refresh.
  useEffect(() => {
    saveDataForDate(meeting.date, { meeting, pdfHeader, participants });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [participants]);

  // --- RENDERERS ---
  return (
    <div className="min-h-screen bg-gray-50 font-sans text-gray-800 selection:bg-blue-200 pb-12">

// ==========================================
// REUSABLE COMPONENT: DISABILITY FORM
// ==========================================
function DisabilityFormSection({ data, onChange }) {
  
  // Handler jika memilih "Bukan Disabilitas"
  const handleNotDisabled = (e) => {
    const isNotDisabled = e.target.checked;
    onChange({
      ...data,
      notDisabled: isNotDisabled,
      // Jika dicentang (bukan disabilitas), kosongkan semua pilihan disabilitas
      disabilities: isNotDisabled ? [] : data.disabilities,
      disabilityOther: isNotDisabled ? '' : data.disabilityOther,
      declineDisabilityInfo: isNotDisabled ? false : data.declineDisabilityInfo
    });
  };

  const handleCheck = (option) => {
    let newDisabilities = [...data.disabilities];
    if (newDisabilities.includes(option)) {
      newDisabilities = newDisabilities.filter(d => d !== option);
    } else {
      newDisabilities.push(option);
    }
    onChange({ ...data, disabilities: newDisabilities, declineDisabilityInfo: false, notDisabled: false });
  };

  const handleDecline = () => {
    onChange({ 
      ...data, 
      declineDisabilityInfo: !data.declineDisabilityInfo,
      disabilities: !data.declineDisabilityInfo ? [] : data.disabilities,
      disabilityOther: !data.declineDisabilityInfo ? '' : data.disabilityOther,
      notDisabled: false
    });
  };

  // Apakah area disabilitas harus diredupkan/dimatikan?
  const isDisabledAreaDisabled = data.notDisabled || data.declineDisabilityInfo;

  return (
    <div className="border border-gray-200 rounded-lg p-4 bg-gray-50/50">
      <label className="block text-sm font-semibold text-gray-700 mb-3 border-b pb-2">
        Informasi Ragam Disabilitas (Opsional)
        <span className="block text-xs text-gray-500 font-normal mt-0.5">Pilih salah satu kondisi di bawah ini.</span>
      </label>
      
      {/* OPSI UTAMA: BUKAN DISABILITAS */}
      <div className="mb-4 pb-3 border-b border-gray-200">
        <label className={`flex items-center gap-2 cursor-pointer p-2.5 rounded-lg border transition-colors ${data.notDisabled ? 'bg-green-50 border-green-200' : 'bg-white border-gray-300 hover:bg-gray-50'}`}>
          <input 
            type="checkbox" 
            checked={data.notDisabled} 
            onChange={handleNotDisabled} 
            className="w-4 h-4 text-green-600 rounded cursor-pointer" 
          />
          <span className={`text-sm font-medium ${data.notDisabled ? 'text-green-800' : 'text-gray-800'}`}>
            Saya Bukan Penyandang Disabilitas
          </span>
        </label>
      </div>

      {/* AREA RAGAM DISABILITAS (Redup jika opsi "Bukan Disabilitas" dicentang) */}
      <div className={`transition-opacity duration-200 ${isDisabledAreaDisabled ? 'opacity-40 pointer-events-none grayscale' : ''}`}>
        <p className="text-xs text-gray-500 mb-2 font-medium">Jika Anda penyandang disabilitas, mohon pilih ragam berikut (bisa lebih dari satu):</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          {DISABILITY_OPTIONS.map(opt => (
            <label key={opt} className="flex items-start gap-2 cursor-pointer">
              <input type="checkbox" checked={data.disabilities.includes(opt)} onChange={() => handleCheck(opt)} className="mt-1 text-blue-600 rounded" />
              <span className="text-sm text-gray-700 leading-tight">{opt}</span>
            </label>
          ))}
        </div>

        <div className="flex flex-col sm:flex-row gap-2 items-start sm:items-center mb-3">
          <label className="flex items-center gap-2 cursor-pointer whitespace-nowrap">
            <input type="checkbox" checked={data.disabilityOther !== ''} onChange={(e) => {
              onChange({...data, disabilityOther: e.target.checked ? ' ' : '', notDisabled: false, declineDisabilityInfo: false})
            }} className="text-blue-600 rounded" />
            <span className="text-sm text-gray-700">Lainnya:</span>
          </label>
          <input 
            type="text" value={data.disabilityOther.trim()} onChange={e => onChange({...data, disabilityOther: e.target.value})}
            disabled={data.disabilityOther === ''}
            placeholder="Sebutkan..."
            className="flex-1 w-full sm:w-auto p-1.5 text-sm border border-gray-300 rounded disabled:bg-gray-100 outline-none focus:ring-1 focus:ring-blue-500"
          />
        </div>
      </div>

      {/* OPSI MENOLAK MENYEBUTKAN (Redup jika "Bukan Disabilitas" dicentang) */}
      <div className={`border-t pt-3 mt-1 transition-opacity duration-200 ${data.notDisabled ? 'opacity-40 pointer-events-none' : ''}`}>
        <label className="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked={data.declineDisabilityInfo} onChange={handleDecline} className="text-red-500 rounded" />
          <span className="text-sm font-medium text-gray-700">Tidak bersedia menyebutkan ragam disabilitas</span>
        </label>
      </div>
    </div>
  );
}

// ==========================================
// VIEW: SIGNATURE PAD
// ==========================================
function SignatureView({ participant, onSave, onCancel, showAlert }) {
  const canvasRef = useRef(null);
  const dimsRef = useRef({ width: 0, height: 250 }); // ukuran CSS (bukan resolusi internal) kanvas, dipakai utk clear & referensi koordinat
  const [isDrawing, setIsDrawing] = useState(false);
  const [hasDrawn, setHasDrawn] = useState(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const setupCanvas = () => {
      const parent = canvas.parentElement;
      const cssWidth = parent.clientWidth;
      const cssHeight = 250;
      // Kunci utama fix "goresan meleset dari titik sentuh": resolusi internal kanvas
      // harus dikalikan devicePixelRatio (layar HP/retina umumnya >1), lalu kanvas
      // di-scale balik lewat ctx.scale supaya semua koordinat gambar tetap dalam
      // satuan piksel CSS — sama persis dengan satuan yang dipakai posisi sentuh/kursor.
      const dpr = window.devicePixelRatio || 1;
      canvas.width = cssWidth * dpr;
      canvas.height = cssHeight * dpr;
      canvas.style.width = cssWidth + 'px';
      canvas.style.height = cssHeight + 'px';
      dimsRef.current = { width: cssWidth, height: cssHeight };

      const ctx = canvas.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0); // reset dulu supaya tidak numpuk scale kalau setupCanvas dipanggil ulang
      ctx.scale(dpr, dpr);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#0f172a';
    };
    setupCanvas();
    // Sesuaikan ulang kanvas saat layar HP diputar (portrait/landscape) atau ukuran jendela berubah
    window.addEventListener('resize', setupCanvas);
    window.addEventListener('orientationchange', setupCanvas);
    return () => {
      window.removeEventListener('resize', setupCanvas);
      window.removeEventListener('orientationchange', setupCanvas);
    };
  }, []);

  const startDrawing = (e) => {
    e.preventDefault(); // Cegah layar ikut ter-scroll saat mulai menyentuh kanvas di HP
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const { x, y } = getCoordinates(e, canvas);
    ctx.beginPath();
    ctx.moveTo(x, y);
    setIsDrawing(true);
  };
  const draw = (e) => {
    if (!isDrawing) return;
    e.preventDefault(); 
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const { x, y } = getCoordinates(e, canvas);
    ctx.lineTo(x, y);
    ctx.stroke();
    setHasDrawn(true);
  };
  const stopDrawing = () => setIsDrawing(false);

  // Selalu hitung posisi lewat getBoundingClientRect (satuan piksel CSS), baik untuk mouse
  // maupun sentuhan, supaya konsisten satu sama lain dan konsisten dengan skala di ctx.scale(dpr).
  const getCoordinates = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const point = (e.touches && e.touches.length > 0) ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  };

  const handleClear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const { width, height } = dimsRef.current;
    ctx.clearRect(0, 0, width, height);
    setHasDrawn(false);
  };

  const handleSave = () => {
    if (!hasDrawn) return showAlert('Silakan coret/tanda tangan terlebih dahulu pada area yang disediakan.');
    onSave(canvasRef.current.toDataURL('image/png'));
  };

  return (
    <div className="max-w-xl mx-auto bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden animate-in zoom-in-95 duration-300 mt-4">
      <div className="p-4 bg-gray-50 border-b flex justify-between items-center">
        <h3 className="font-bold text-gray-800">Tanda Tangan Digital</h3>
        <button onClick={onCancel} className="text-gray-400 hover:text-gray-600 p-1 bg-white rounded-full shadow-sm border"><X size={18} /></button>
      </div>
      <div className="p-6 space-y-4">
        <div className="text-center mb-2">
          <p className="text-sm text-gray-500">Absen untuk:</p>
          <p className="text-xl font-bold text-gray-900">{participant.name}</p>
        </div>
        <div className="border-2 border-dashed border-blue-200 rounded-lg bg-blue-50/30 relative overflow-hidden">
          <canvas
            ref={canvasRef}
            onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
            onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
            className="w-full touch-none cursor-crosshair" style={{ touchAction: 'none' }}
          />
          {!hasDrawn && (
            <div className="absolute inset-0 pointer-events-none flex items-center justify-center text-gray-400 opacity-60">
              <span className="text-lg font-medium tracking-wide">Goreskan Tanda Tangan Disini</span>
            </div>
          )}
        </div>
        <div className="flex gap-3 pt-4">
          <button onClick={handleClear} className="flex-1 py-3 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg transition">Ulangi</button>
          <button onClick={handleSave} className={`flex-1 py-3 px-4 font-semibold rounded-lg transition text-white shadow-md flex justify-center items-center gap-2 ${hasDrawn ? 'bg-blue-600 hover:bg-blue-700' : 'bg-blue-300 cursor-not-allowed'}`}>
            <CheckCircle size={18} /> Simpan & Hadir
          </button>
        </div>
      </div>
    </div>
  );
}

// VIEW: THANK YOU
// ==========================================
function ThankYouView({ participant }) {
  return (
    <div className="max-w-md mx-auto mt-16 bg-white rounded-2xl shadow-lg border border-gray-100 p-10 text-center animate-in slide-in-from-bottom-8 duration-500">
      <div className="w-24 h-24 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><CheckCircle size={50} /></div>
      <h2 className="text-3xl font-extrabold text-gray-800 mb-3">Terima Kasih!</h2>
      <p className="text-gray-600 mb-8 text-lg">Kehadiran <strong>{participant?.name}</strong> tersimpan.</p>
    </div>
  );
}

// ==========================================
// VIEW: ADMIN PORTAL
// ==========================================
function AdminPortal({ meeting, setMeeting, participants, setParticipants, pdfHeader, setPdfHeader, showConfirm, setLogoError, onSaveSettings }) {
  const [activeTab, setActiveTab] = useState('settings'); 
  const [newParticipant, setNewParticipant] = useState({
    name: '', gender: 'L', institution: '', role: '', phone: '',
    disabilities: [], disabilityOther: '', declineDisabilityInfo: false, notDisabled: false
  });

  const handleMeetingChange = (e) => {
    const { name, value, type, checked } = e.target;
    setMeeting(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
  };

  const handleAddParticipant = (e) => {
    e.preventDefault();
    if (!newParticipant.name.trim()) return;
    const newP = { ...newParticipant, id: Date.now(), signature: null };
    setParticipants(prev => [...prev, newP]);
    setNewParticipant({ name: '', gender: 'L', institution: '', role: '', phone: '', disabilities: [], disabilityOther: '', declineDisabilityInfo: false, notDisabled: false });
    syncParticipantToSheet(meeting, newP); // Simpan ke tab "Peserta" (belum TTD) supaya terlihat di semua perangkat
  };

  const handleDeleteParticipant = (p) => {
    showConfirm('Hapus?', () => {
      setParticipants(arr => arr.filter(x => x.id !== p.id));
      deleteParticipantFromSheet(meeting, p.id);
    });
  };

  const handleResetSignatures = () => {
    showConfirm('Reset semua TTD?', () => {
      const toReset = participants.filter(x => x.signature);
      setParticipants(p => p.map(x => ({...x, signature: null})));
      toReset.forEach(x => syncParticipantToSheet(meeting, x, { clearSignature: true }));
    });
  };

  return (
    <div className="space-y-6 animate-in fade-in duration-300">
      <div className="bg-gradient-to-r from-gray-800 to-gray-900 rounded-xl p-6 text-white shadow-md flex justify-between items-center">
        <div><h2 className="text-2xl font-bold flex items-center gap-2"><Shield className="text-blue-400" /> Portal Admin</h2></div>
      </div>

      <div className="flex border-b border-gray-200 overflow-x-auto whitespace-nowrap">
        <button onClick={() => setActiveTab('settings')} className={`px-6 py-3 font-medium text-sm border-b-2 transition-colors ${activeTab === 'settings' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>Pengaturan & Cetak</button>
        <button onClick={() => setActiveTab('participants')} className={`px-6 py-3 font-medium text-sm border-b-2 transition-colors ${activeTab === 'participants' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>Manajemen Data Peserta</button>
      </div>

      {activeTab === 'settings' && (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm space-y-4">
            <h3 className="font-bold text-gray-800 border-b pb-2">Detail Kegiatan</h3>
            <div>
              <label className="block text-xs font-semibold text-gray-600 mb-1">Nama Kegiatan</label>
              <textarea name="title" value={meeting.title} onChange={handleMeetingChange} rows="3" className="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" />
            </div>
            <div className="flex gap-3">
              <div className="flex-1">
                <label className="block text-xs font-semibold text-gray-600 mb-1">Tanggal</label>
                <input type="date" name="date" value={meeting.date} onChange={handleMeetingChange} className="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50"/>
              </div>
              <div className="flex-1">
                <label className="block text-xs font-semibold text-gray-600 mb-1">Jam Kegiatan</label>
                <input type="time" name="time" value={meeting.time} onChange={handleMeetingChange} className="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50"/>
              </div>
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-600 mb-1">Pelaksanaan</label>
              <select name="mode" value={meeting.mode} onChange={handleMeetingChange} className="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
                <option value="Offline">Offline (Tatap Muka)</option>
                <option value="Online">Online (Daring)</option>
              </select>
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-600 mb-1">{meeting.mode === 'Online' ? 'Link / Platform Online' : 'Lokasi Kegiatan'}</label>
              <input type="text" name="location" value={meeting.location} onChange={handleMeetingChange} placeholder={meeting.mode === 'Online' ? 'Contoh: Zoom Meeting / Google Meet' : 'Contoh: Aula Gedung...'} className="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50"/>
            </div>
            <label className="flex items-start gap-3 cursor-pointer p-3 mt-2 bg-blue-50 rounded-lg border border-blue-100">
              <input type="checkbox" name="allowManualEntry" checked={meeting.allowManualEntry} onChange={handleMeetingChange} className="w-4 h-4 mt-0.5 text-blue-600 rounded"/>
              <div><span className="text-sm font-bold text-blue-900 block">Izinkan Isi Mandiri</span></div>
            </label>
            <button onClick={onSaveSettings} className="w-full flex justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg mt-2">
              <CheckCircle size={18} /> Simpan Data
            </button>
            <p className="text-xs text-gray-500 text-center -mt-2">Judul, tanggal & lokasi akan tersimpan untuk tanggal kegiatan ini, dan halaman absensi tidak lagi menampilkan data contoh.</p>
          </div>
          <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm space-y-4">
            <h3 className="font-bold text-gray-800 border-b pb-2 flex items-center gap-2"><ImageIcon size={18}/> Logo & Judul Cetak</h3>
            
            <div>
              <label className="block text-xs font-semibold text-gray-600 mb-1">Upload Logo (AKSI / Instansi)</label>
              <input type="file" accept="image/*" onChange={(e) => { const f = e.target.files[0]; if(f){ const r = new FileReader(); r.onloadend = () => { setPdfHeader(prev => ({...prev, logo: r.result})); setLogoError(false); }; r.readAsDataURL(f); } }} className="w-full text-sm p-2 border rounded-lg bg-gray-50" />
              {pdfHeader.logo && (
                <div className="mt-2 text-xs text-green-600 flex items-center gap-1"><CheckCircle size={14}/> Logo berhasil dipasang</div>
              )}
            </div>

            <div>
              <label className="block text-xs font-semibold text-gray-600 mb-1">Judul Dokumen</label>
              <textarea value={pdfHeader.text} onChange={(e) => setPdfHeader(prev => ({...prev, text: e.target.value}))} rows="2" className="w-full text-sm p-2.5 border rounded-lg bg-gray-50" />
            </div>

            <button onClick={() => window.print()} className="w-full flex justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg mt-4"><Printer size={18} /> Cetak PDF (Landscape)</button>
          </div>
        </div>
      )}

      {activeTab === 'participants' && (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="md:col-span-1 bg-white p-5 rounded-xl border border-gray-200 shadow-sm max-h-[80vh] overflow-y-auto">
            <h3 className="font-bold text-gray-800 mb-4 border-b pb-2">Tambah Peserta</h3>
            <form onSubmit={handleAddParticipant} className="space-y-3">
              <input type="text" required value={newParticipant.name} onChange={e => setNewParticipant({...newParticipant, name: e.target.value})} className="w-full text-sm p-2 border rounded" placeholder="Nama *" />
              <div className="flex gap-2">
                <select value={newParticipant.gender} onChange={e => setNewParticipant({...newParticipant, gender: e.target.value})} className="w-1/3 text-sm p-2 border rounded"><option value="L">L</option><option value="P">P</option></select>
                <input type="tel" value={newParticipant.phone} onChange={e => setNewParticipant({...newParticipant, phone: e.target.value})} className="w-2/3 text-sm p-2 border rounded" placeholder="No HP" />
              </div>
              <input type="text" value={newParticipant.institution} onChange={e => setNewParticipant({...newParticipant, institution: e.target.value})} className="w-full text-sm p-2 border rounded" placeholder="Institusi" />
              <input type="text" value={newParticipant.role} onChange={e => setNewParticipant({...newParticipant, role: e.target.value})} className="w-full text-sm p-2 border rounded" placeholder="Jabatan" />
              
              <div className="mt-4 pt-4 border-t">
                 <DisabilityFormSection data={newParticipant} onChange={setNewParticipant} />
              </div>

              <button type="submit" className="w-full flex justify-center gap-2 bg-gray-800 hover:bg-black text-white text-sm font-medium py-2 px-4 rounded mt-2">
                <Plus size={16} /> Tambah Data
              </button>
            </form>
          </div>

          <div className="md:col-span-2 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col h-[80vh]">
            <div className="p-4 border-b flex justify-between bg-gray-50">
              <h3 className="font-bold text-gray-800">Database Kehadiran</h3>
              <div className="flex gap-2">
                 <button onClick={handleResetSignatures} className="text-xs text-red-600 border px-2 py-1 rounded hover:bg-red-50">Reset TTD</button>
                 <button onClick={() => window.print()} className="text-xs bg-indigo-600 text-white px-3 py-1 rounded">Cetak PDF</button>
              </div>
            </div>
            <div className="overflow-auto flex-1 p-0">
              <table className="w-full text-left text-sm">
                <thead className="bg-gray-100 text-gray-700 sticky top-0 border-b">
                  <tr><th className="px-4 py-2">Nama</th><th className="px-4 py-2">Info Disabilitas</th><th className="px-4 py-2 text-center">TTD</th><th className="px-4 py-2 text-center">Hapus</th></tr>
                </thead>
                <tbody className="divide-y">
                  {participants.map(p => (
                    <tr key={p.id} className="hover:bg-gray-50">
                      <td className="px-4 py-2">
                        <span className="font-medium">{p.name}</span>
                        <div className="text-xs text-gray-500">{p.institution}</div>
                      </td>
                      <td className="px-4 py-2 text-xs">
                        {p.notDisabled ? <span className="inline-block bg-green-100 text-green-700 px-2 py-0.5 rounded-full">Bukan Disabilitas</span> 
                         : p.declineDisabilityInfo ? <span className="text-red-500">Menolak sebut</span> 
                         : p.disabilities.length > 0 || p.disabilityOther ? <span className="text-blue-600">Disabilitas ({p.disabilities.length + (p.disabilityOther?1:0)})</span>
                         : <span className="text-gray-400">Belum diisi</span>}
                      </td>
                      <td className="px-4 py-2 text-center">{p.signature ? <span className="text-green-600 font-bold">✓</span> : '-'}</td>
                      <td className="px-4 py-2 text-center"><button onClick={() => handleDeleteParticipant(p)} className="text-red-500"><Trash2 size={16}/></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ==========================================
// VIEW: PRINT TEMPLATE (PDF LAYOUT MIRRORING PHYSICAL FORM)
// ==========================================
function PrintTemplate({ meeting, participants, pdfHeader, logoError }) {
  const formattedDate = new Date(meeting.date).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  // Hitung jumlah yang disabilitas (notDisabled === false && ada isian) 
  const totalL = participants.filter(p => p.gender === 'L').length;
  const totalP = participants.filter(p => p.gender === 'P').length;
  const hasDisability = (p) => !p.notDisabled && (p.disabilities?.length > 0 || p.disabilityOther !== '');
  const disL = participants.filter(p => p.gender === 'L' && hasDisability(p)).length;
  const disP = participants.filter(p => p.gender === 'P' && hasDisability(p)).length;

  const renderCheck = (label, isChecked) => (
    <div className="flex items-start gap-1 text-[8px] leading-[1.1] mb-0.5 break-inside-avoid">
      <div className={`w-2.5 h-2.5 mt-[1px] border border-black shrink-0 ${isChecked ? 'bg-black' : ''}`} style={isChecked ? { WebkitPrintColorAdjust: 'exact', printColorAdjust: 'exact' } : {}}></div>
      <span>{label}</span>
    </div>
  );

  return (
    <div className="w-full font-sans print-content text-black h-full flex flex-col pt-2">
      <div className="flex justify-between items-start mb-4 w-full">
        
        {/* Kiri & Tengah: Logo dan Metadata */}
        <div className="flex-1 pr-4 flex gap-6 items-start">
          {pdfHeader.logo && !logoError && (
            <img src={pdfHeader.logo} alt="Logo" className="w-[80px] h-[80px] object-contain shrink-0" style={{printColorAdjust: 'exact'}} />
          )}
          
          <div>
            <div className="whitespace-pre-wrap font-extrabold text-2xl tracking-wide mb-4 mt-2">{pdfHeader.text}</div>
            <table className="text-[11px] font-medium">
              <tbody>
                <tr><td className="pr-4 py-0.5 align-top whitespace-nowrap">Nama Kegiatan/Workshop</td><td className="px-1 py-0.5 align-top">:</td><td className="py-0.5 font-bold uppercase">{meeting.title}</td></tr>
                <tr><td className="pr-4 py-0.5 align-top whitespace-nowrap">Hari & Tanggal</td><td className="px-1 py-0.5 align-top">:</td><td className="py-0.5">{formattedDate}{meeting.time ? `, Pukul ${meeting.time} WIB` : ''}</td></tr>
                <tr><td className="pr-4 py-0.5 align-top whitespace-nowrap">Pelaksanaan</td><td className="px-1 py-0.5 align-top">:</td><td className="py-0.5">{meeting.mode === 'Online' ? 'Online (Daring)' : 'Offline (Tatap Muka)'}</td></tr>
                <tr><td className="pr-4 py-0.5 align-top whitespace-nowrap">{meeting.mode === 'Online' ? 'Link/Platform' : 'Lokasi Kegiatan'}</td><td className="px-1 py-0.5 align-top">:</td><td className="py-0.5">{meeting.location}</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        {/* Kanan: Box Summary */}
        <div className="w-64 shrink-0 mt-8">
           <table className="w-full border-collapse border border-black text-[10px]">
             <tbody>
                <tr>
                  <td className="border border-black p-1 font-bold bg-gray-200 w-1/2">Total Peserta</td>
                  <td className="border border-black p-1 font-bold bg-gray-200 text-center w-1/2">ASOSIASI KEPALA SEKOLAH INDONESIA</td>
                </tr>
                <tr><td className="border border-black p-1">Laki-laki</td><td className="border border-black p-1 text-center font-bold">{totalL}</td></tr>
                <tr><td className="border border-black p-1">Perempuan</td><td className="border border-black p-1 text-center font-bold">{totalP}</td></tr>
                <tr><td className="border border-black p-1">Total</td><td className="border border-black p-1 text-center font-bold bg-gray-100">{totalL + totalP}</td></tr>
                <tr><td colSpan="2" className="border border-black p-1 font-bold bg-gray-200">Total Disabilitas</td></tr>
                <tr><td className="border border-black p-1">Laki-laki</td><td className="border border-black p-1 text-center font-bold">{disL}</td></tr>
                <tr><td className="border border-black p-1">Perempuan</td><td className="border border-black p-1 text-center font-bold">{disP}</td></tr>
                <tr><td className="border border-black p-1">Total</td><td className="border border-black p-1 text-center font-bold bg-gray-100">{disL + disP}</td></tr>
             </tbody>
           </table>
        </div>
      </div>

      <div className="w-full flex-1">
        <table className="w-full border-collapse border border-black text-[10px]">
          <thead className="bg-gray-800 text-white text-[10px]">
            <tr>
              <th className="border border-gray-400 p-1.5 text-center w-[3%] font-bold">No.</th>
              <th className="border border-gray-400 p-1.5 w-[12%] font-bold text-center">Nama Peserta</th>
              <th className="border border-gray-400 p-1.5 text-center w-[4%] font-bold">L/P</th>
              <th className="border border-gray-400 p-1.5 w-[11%] font-bold text-center">Institusi</th>
              <th className="border border-gray-400 p-1.5 w-[10%] font-bold text-center">Jabatan</th>
              <th className="border border-gray-400 p-1.5 w-[10%] font-bold text-center">Handphone</th>
              <th className="border border-gray-400 p-1 w-[38%] font-bold text-center leading-tight">
                Jika Anda Penyandang Disabilitas, Mohon berikan informasi Ragam Disabilitas di bawah ini: (bisa pilih lebih dari satu)
              </th>
              <th className="border border-gray-400 p-1.5 text-center w-[12%]" colSpan="2">Tanda Tangan</th>
            </tr>
          </thead>
          <tbody className="text-black">
            {participants.map((p, i) => (
              <tr key={p.id}>
                <td className="border border-black p-1 text-center align-middle bg-gray-100 font-bold">{i + 1}</td>
                <td className="border border-black p-1.5 align-middle uppercase font-bold text-[11px]">{p.name}</td>
                <td className="border border-black p-1 text-center align-middle">{p.gender}</td>
                <td className="border border-black p-1.5 align-middle">{p.institution}</td>
                <td className="border border-black p-1.5 align-middle">{p.role}</td>
                <td className="border border-black p-1.5 align-middle text-center">{p.phone}</td>
                
                {/* KOLOM DISABILITAS KOMPLEKS */}
                <td className="border border-black p-1 align-top bg-gray-50/30">
                  {/* Jika "Bukan Disabilitas" dicentang, PDF tetap kosong saja seperti form aslinya */}
                  {p.notDisabled ? (
                    <div className="flex h-full items-center justify-center text-[10px] text-gray-500 italic">- (Bukan Disabilitas) -</div>
                  ) : (
                    <div className="grid grid-cols-3 gap-1">
                      <div>
                        {renderCheck('Disabilitas Fisik', p.disabilities?.includes('Disabilitas Fisik'))}
                        {renderCheck('Disabilitas Netra', p.disabilities?.includes('Disabilitas Netra'))}
                        {renderCheck('Disabilitas Rungu dan/Wicara', p.disabilities?.includes('Disabilitas Rungu dan/Wicara'))}
                      </div>
                      <div>
                        {renderCheck('Disabilitas Intelektual', p.disabilities?.includes('Disabilitas Intelektual'))}
                        {renderCheck('Disabilitas Mental (Psikososial)', p.disabilities?.includes('Disabilitas Mental (Psikososial)'))}
                        {renderCheck('Disabilitas Mental (Perkembangan)', p.disabilities?.includes('Disabilitas Mental (Perkembangan)'))}
                      </div>
                      <div>
                        <div className="flex items-start gap-1 text-[8px] leading-[1.1] mb-0.5">
                          <div className={`w-2.5 h-2.5 mt-[1px] border border-black shrink-0 ${p.disabilityOther ? 'bg-black' : ''}`} style={p.disabilityOther ? { WebkitPrintColorAdjust: 'exact', printColorAdjust: 'exact' } : {}}></div>
                          <span className="truncate">Lainnya: {p.disabilityOther ? <u className="font-bold">{p.disabilityOther}</u> : '......................'}</span>
                        </div>
                        {renderCheck('Tidak bersedia menyebutkan', p.declineDisabilityInfo)}
                      </div>
                    </div>
                  )}
                </td>
                
                <td className={`border border-black p-1 align-middle relative h-[50px] w-[6%] ${i % 2 === 0 ? '' : 'border-r-0'}`}>
                  {i % 2 === 0 && (
                    <div className="w-full h-full relative flex items-center justify-center">
                      <span className="absolute top-0 left-0.5 text-[9px] text-gray-500 font-bold">{i + 1}.</span>
                      {p.signature && <img src={p.signature} alt="TTD" className="max-h-full max-w-full object-contain" style={{printColorAdjust: 'exact'}} />}
                    </div>
                  )}
                </td>
                <td className={`border border-black p-1 align-middle relative h-[50px] w-[6%] ${i % 2 !== 0 ? '' : 'border-l-0'}`}>
                   {i % 2 !== 0 && (
                    <div className="w-full h-full relative flex items-center justify-center">
                      <span className="absolute top-0 left-0.5 text-[9px] text-gray-500 font-bold">{i + 1}.</span>
                      {p.signature && <img src={p.signature} alt="TTD" className="max-h-full max-w-full object-contain" style={{printColorAdjust: 'exact'}} />}
                    </div>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
